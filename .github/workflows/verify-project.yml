name: استيراد أطلس الإنسان الكامل

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest

    steps:
      - name: Download original project
        uses: actions/checkout@v4
        with:
          repository: slorksmo/Human-Atlas
          path: original
          persist-credentials: false

      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          path: destination
          ref: main
          persist-credentials: true

      - name: Copy original project
        run: |
          set -e
          rsync -a --delete \
            --exclude='/.git/' \
            original/ destination/

      - name: Commit and push project files
        working-directory: destination
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Keep the destination repository's workflow files unchanged.
          git restore --staged --worktree -- .github

          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi

          git commit -m "Import complete original Human Atlas project"
          git push origin HEAD:main
