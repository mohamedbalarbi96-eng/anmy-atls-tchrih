name: استيراد أطلس الإنسان الكامل

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest

    steps:
      - name: Download original project
        uses: actions/checkout@v4
        with:
          repository: slorksmo/Human-Atlas
          path: original
          persist-credentials: false

      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          path: destination
          ref: main

      - name: Copy original project
        run: |
          set -e
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            original/ destination/

      - name: Commit and push project files
        working-directory: destination
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Restore the index for GitHub workflow files.
          # This prevents workflow changes from entering the commit.
          git reset HEAD -- .github

          echo "Files staged for commit:"
          git diff --cached --name-status

          # Fail safely if any workflow file is staged.
          if git diff --cached --name-only | grep -E '(^|/)\.github/workflows/'; then
            echo "ERROR: A GitHub workflow file is staged."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi

          git commit -m "Import complete original Human Atlas project"
          git push origin HEAD:main
